name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GONZO_KEYSTORE_B64: ${{ secrets.GONZO_KEYSTORE }}
      GONZO_KS_PASS: ${{ secrets.GONZO_KS_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install SDK
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" > /dev/null
      - run: chmod +x gradlew && ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with: { name: gonzo-apk, path: app/build/outputs/apk/release/*.apk }